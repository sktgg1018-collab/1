<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>书脉 · BookGraph</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Mono&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1b2430;--muted:#697586;--line:#e7ebf0;--paper:#f8f9fb;--blue:#3a68d8;--violet:#8459cb;--gold:#d99a25;--teal:#239c8d;--rose:#cf5574;--white:#fff}*{box-sizing:border-box}body{margin:0;background:var(--paper);font-family:"Noto Sans SC",sans-serif;color:var(--ink)}header{height:66px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 32px;gap:28px}.logo{font-weight:700;font-size:20px;letter-spacing:-.5px}.mark{display:inline-grid;place-items:center;background:var(--blue);color:#fff;width:28px;height:28px;border-radius:8px;margin-right:8px;font-size:15px}.tag{font:12px "DM Mono";color:var(--muted);border-left:1px solid var(--line);padding-left:22px}main{display:grid;grid-template-columns:310px 1fr;min-height:calc(100vh - 66px)}aside{background:#fff;border-right:1px solid var(--line);padding:22px 18px}.section{margin-bottom:23px}.section h3{font-size:12px;color:var(--muted);letter-spacing:.08em;margin:0 0 10px;text-transform:uppercase}.input,select,textarea{width:100%;border:1px solid #dce2e9;background:#fff;border-radius:8px;padding:10px 11px;font:13px inherit;color:var(--ink);outline:none}.input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px #e8efff}textarea{height:150px;resize:vertical;line-height:1.55}.btn{border:0;border-radius:8px;padding:10px 12px;background:var(--blue);color:white;font:600 13px inherit;cursor:pointer}.btn:hover{filter:brightness(.94)}.btn.alt{background:#eef2f7;color:#364152}.row{display:flex;gap:8px}.row>*{flex:1}.check{font-size:13px;display:flex;align-items:center;gap:8px;margin:8px 0}.hint{font-size:12px;color:var(--muted);line-height:1.6;margin-top:7px}.stage{padding:24px 28px}.top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:18px}.title h1{font-size:22px;margin:0 0 5px}.title p{font-size:13px;color:var(--muted);margin:0}.stats{display:flex;gap:8px}.stat{padding:8px 12px;background:#fff;border:1px solid var(--line);border-radius:8px;text-align:center;font:12px "DM Mono";min-width:70px}.stat b{display:block;font:600 17px "Noto Sans SC"}.workspace{display:grid;grid-template-columns:minmax(560px,1fr) 285px;gap:17px}.card{background:white;border:1px solid var(--line);border-radius:12px;overflow:hidden}.tools{height:52px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 14px}.legend{display:flex;gap:13px;font-size:11px;color:#586476}.dot{width:9px;height:9px;border-radius:99px;display:inline-block;margin-right:4px}.canvas{height:590px;position:relative;background-image:radial-gradient(#dfe5ec 1px,transparent 1px);background-size:18px 18px}svg{width:100%;height:100%;display:block}.edge{stroke:#bfc9d7;stroke-width:1.3}.edge.active{stroke:#273d74;stroke-width:3}.node{cursor:pointer;stroke:#fff;stroke-width:3;filter:drop-shadow(0 2px 3px #b9c3d233)}.node.dim,.edge.dim{opacity:.13}.nodeLabel{font-size:12px;fill:#324154;pointer-events:none;font-weight:500}.sidehead{padding:15px;border-bottom:1px solid var(--line);font-weight:600;font-size:14px}.detail{padding:15px}.empty{color:var(--muted);font-size:13px;line-height:1.7}.badge{font-size:11px;border-radius:99px;padding:3px 7px;display:inline-block;background:#f0f3f8;color:#526174;margin-right:4px;margin-top:5px}.detail h2{font-size:19px;margin:10px 0 3px}.detail .type{font:11px "DM Mono";color:var(--blue)}.rel{margin-top:17px;border-top:1px solid var(--line);padding-top:12px;font-size:13px}.rel-item{padding:8px 0;border-bottom:1px solid #eff2f5;cursor:pointer}.rel-item span{color:var(--blue);font-size:11px;margin-right:4px}.queryResult{max-height:142px;overflow:auto;margin-top:10px}.result{font-size:12px;padding:7px 8px;border-radius:6px;cursor:pointer}.result:hover{background:#f1f5ff}.notice{position:fixed;right:22px;bottom:22px;background:#1f2c3c;color:#fff;padding:10px 14px;border-radius:8px;font-size:13px;transform:translateY(70px);opacity:0;transition:.25s}.notice.on{transform:none;opacity:1}@media(max-width:950px){main{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--line)}.workspace{grid-template-columns:1fr}.canvas{height:480px}.stage{padding:18px}.stats{display:none}}
</style></head><body>
<header><div class="logo"><span class="mark">书</span>书脉 <span style="font-weight:400;color:#708098">BookGraph</span></div><div class="tag">BOOK KNOWLEDGE GRAPH · v1.0</div></header>
<main><aside>
<div class="section"><h3>导入书籍资料</h3><textarea id="source">《三体》是刘慈欣创作的科幻长篇小说，2008年由重庆出版社出版。故事讲述科学家叶文洁、纳米材料学家汪淼与警察史强在地球文明和三体文明接触中的经历，探讨宇宙社会学、文明冲突与黑暗森林法则。</textarea><div class="row" style="margin-top:8px"><button class="btn" onclick="extract()">自动提取并入图</button><button class="btn alt" onclick="loadDemo()">载入示例</button></div><div class="hint">可粘贴书名、简介、作者、出版社、ISBN 等信息。内置规则会识别书籍、人物、主题、出版信息与关系。</div></div>
<div class="section"><h3>条件检索</h3><input class="input" id="keyword" placeholder="名称或关键词" oninput="query()"><div class="row" style="margin-top:8px"><select id="typeFilter" onchange="query()"><option value="">全部实体类型</option><option>书籍</option><option>作者</option><option>角色</option><option>主题</option><option>出版社</option><option>年份</option></select><select id="relFilter" onchange="query()"><option value="">全部关系</option><option>创作</option><option>属于</option><option>关联</option><option>出版</option></select></div><div class="queryResult" id="results"></div></div>
<div class="section"><h3>图谱操作</h3><label class="check"><input id="labels" type="checkbox" checked onchange="render()"> 显示节点名称</label><label class="check"><input id="direction" type="checkbox" onchange="render()"> 显示关系方向</label><div class="row"><button class="btn alt" onclick="clearFocus()">清除聚焦</button><button class="btn alt" onclick="resetGraph()">重置图谱</button></div></div>
</aside>
<section class="stage"><div class="top"><div class="title"><h1>书籍知识网络</h1><p>点击节点查看属性；双击节点展开一跳关联；选择两个节点浏览最短路径。</p></div><div class="stats"><div class="stat"><b id="nCount">0</b>实体</div><div class="stat"><b id="eCount">0</b>关系</div><div class="stat"><b id="tCount">0</b>类型</div></div></div>
<div class="workspace"><div class="card"><div class="tools"><div class="legend"><span><i class="dot" style="background:#3a68d8"></i>书籍</span><span><i class="dot" style="background:#8459cb"></i>作者</span><span><i class="dot" style="background:#239c8d"></i>角色</span><span><i class="dot" style="background:#d99a25"></i>主题</span></div><div style="font:11px 'DM Mono';color:#718096">INTERACTIVE GRAPH</div></div><div class="canvas"><svg id="graph" viewBox="0 0 760 590"></svg></div></div><div class="card"><div class="sidehead">实体详情 <span id="pathMode" style="float:right;color:#798698;font:11px 'DM Mono'"></span></div><div class="detail" id="detail"><div class="empty">从图中选择一个实体开始探索。<br><br>提示：连续选择两个节点可高亮它们之间的最短路径。</div></div></div></div>
</section></main><div class="notice" id="notice"></div>
<script>
const colors={书籍:'#3a68d8',作者:'#8459cb',角色:'#239c8d',主题:'#d99a25',出版社:'#cf5574',年份:'#718096'};
let nodes=[],edges=[],focus=[],selectForPath=[];
const layouts=[[380,285],[182,132],[560,132],[104,338],[655,338],[286,468],[480,468],[90,500],[675,500],[380,85]];
const demo={nodes:[['b1','三体','书籍','科幻长篇小说'],['a1','刘慈欣','作者','中国科幻作家'],['c1','叶文洁','角色','天体物理学家'],['c2','汪淼','角色','纳米材料学家'],['c3','史强','角色','刑警'],['t1','宇宙社会学','主题','作品主题'],['t2','文明冲突','主题','作品主题'],['t3','黑暗森林','主题','核心法则'],['p1','重庆出版社','出版社','出版机构'],['y1','2008年','年份','出版年份']],edges:[['a1','b1','创作'],['c1','b1','属于'],['c2','b1','属于'],['c3','b1','属于'],['t1','b1','关联'],['t2','b1','关联'],['t3','b1','关联'],['p1','b1','出版'],['y1','b1','出版']]}
function seed(d=demo){nodes=d.nodes.map((x,i)=>({id:x[0],name:x[1],type:x[2],desc:x[3],x:layouts[i%layouts.length][0],y:layouts[i%layouts.length][1]}));edges=d.edges.map(x=>({source:x[0],target:x[1],label:x[2]}));focus=[];selectForPath=[];render();query()}
function render(){const svg=document.getElementById('graph'), labels=document.getElementById('labels').checked,dir=document.getElementById('direction').checked;let html=dir?'<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#768598"/></marker></defs>':'';let show=focus.length?new Set(focus):null;edges.forEach((e,i)=>{let a=nodes.find(n=>n.id===e.source),b=nodes.find(n=>n.id===e.target),on=!show||show.has(a.id)&&show.has(b.id);html+=`<line class="edge ${on?'':'dim'}" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" ${dir?'marker-end="url(#arrow)"':''}/><text x="${(a.x+b.x)/2}" y="${(a.y+b.y)/2-5}" text-anchor="middle" font-size="10" fill="#8290a0">${on?e.label:''}</text>`});nodes.forEach(n=>{let on=!show||show.has(n.id);html+=`<g ondblclick="expand('${n.id}')" onclick="pick('${n.id}')"><circle class="node ${on?'':'dim'}" cx="${n.x}" cy="${n.y}" r="${n.type==='书籍'?25:19}" fill="${colors[n.type]}"/><text x="${n.x}" y="${n.y+4}" text-anchor="middle" fill="white" font-size="11">${n.type==='书籍'?'书':n.type[0]}</text>${labels?`<text class="nodeLabel ${on?'':'dim'}" x="${n.x}" y="${n.y+37}" text-anchor="middle">${n.name}</text>`:''}</g>`});svg.innerHTML=html;document.getElementById('nCount').textContent=nodes.length;document.getElementById('eCount').textContent=edges.length;document.getElementById('tCount').textContent=new Set(nodes.map(n=>n.type)).size}
function pick(id){let n=nodes.find(x=>x.id===id);showDetail(n);if(!selectForPath.includes(id))selectForPath.push(id);if(selectForPath.length>2)selectForPath.shift();if(selectForPath.length===2){focus=shortest(selectForPath[0],selectForPath[1]);document.getElementById('pathMode').textContent='PATH · '+focus.length+' nodes';render()}else{focus=[id,...edges.filter(e=>e.source===id||e.target===id).flatMap(e=>[e.source,e.target])];document.getElementById('pathMode').textContent='NEIGHBORS';render()}}
function showDetail(n){let rs=edges.filter(e=>e.source===n.id||e.target===n.id);document.getElementById('detail').innerHTML=`<div class="type">${n.type.toUpperCase()}</div><h2>${n.name}</h2><div class="empty">${n.desc}</div><div><span class="badge">ID · ${n.id}</span><span class="badge">${rs.length} 条关系</span></div><div class="rel"><b>关联实体</b>${rs.map(e=>{let other=nodes.find(x=>x.id===(e.source===n.id?e.target:e.source));return `<div class="rel-item" onclick="pick('${other.id}')"><span>${e.label}</span> ${other.name} · ${other.type}</div>`}).join('')||'<div class="empty">暂无关联</div>'}</div>`}
function shortest(s,t){let q=[[s]],seen=new Set([s]);while(q.length){let p=q.shift(),u=p.at(-1);if(u===t)return p;edges.filter(e=>e.source===u||e.target===u).forEach(e=>{let v=e.source===u?e.target:e.source;if(!seen.has(v)){seen.add(v);q.push([...p,v])}})}return[s,t]}
function expand(id){let n=nodes.find(x=>x.id===id);notify('已展开「'+n.name+'」的一跳关系');focus=[id,...edges.filter(e=>e.source===id||e.target===id).flatMap(e=>[e.source,e.target])];render()}
function clearFocus(){focus=[];selectForPath=[];document.getElementById('pathMode').textContent='';render()}
function query(){let k=document.getElementById('keyword').value.trim(),ty=document.getElementById('typeFilter').value,re=document.getElementById('relFilter').value;let matched=nodes.filter(n=>(!k||n.name.includes(k)||n.desc.includes(k))&&(!ty||n.type===ty)&&(!re||edges.some(e=>e.label===re&&(e.source===n.id||e.target===n.id))));document.getElementById('results').innerHTML=matched.length?matched.map(n=>`<div class="result" onclick="pick('${n.id}')"><b>${n.name}</b> <span class="type">${n.type}</span><br><span style="color:#7b8794">${n.desc}</span></div>`).join(''):'<div class="empty">未找到匹配实体</div>'}
function extract(){let txt=document.getElementById('source').value;if(!txt.trim())return notify('请先输入书籍资料');let title=(txt.match(/《([^》]+)》/)||[])[1]||'未命名书籍',author=(txt.match(/(?:是|由)([\u4e00-\u9fa5]{2,4})(?:创作|所著|著)/)||[])[1]||'待识别作者',year=(txt.match(/(1[89]\d{2}|20\d{2})年/)||[])[1],pub=(txt.match(/由([\u4e00-\u9fa5]{2,12}出版社)出版/)||[])[1];let ns=[['b1',title,'书籍','由导入资料自动创建'],['a1',author,'作者','自动识别的作者实体']],es=[['a1','b1','创作']];let chars=['叶文洁','汪淼','史强','哈利·波特','福尔摩斯','简·爱'];chars.filter(x=>txt.includes(x)).forEach((x,i)=>{ns.push(['c'+i,x,'角色','从书籍简介识别']);es.push(['c'+i,'b1','属于'])});['科幻','爱情','历史','悬疑','成长','文明冲突','人工智能','宇宙'].filter(x=>txt.includes(x)).forEach((x,i)=>{ns.push(['t'+i,x,'主题','从文本关键词识别']);es.push(['t'+i,'b1','关联'])});if(pub){ns.push(['p1',pub,'出版社','自动识别的出版机构']);es.push(['p1','b1','出版'])}if(year){ns.push(['y1',year+'年','年份','自动识别的出版年份']);es.push(['y1','b1','出版'])}seed({nodes:ns,edges:es});notify('提取完成：生成 '+ns.length+' 个实体、'+es.length+' 条关系')}
function loadDemo(){document.getElementById('source').value='《三体》是刘慈欣创作的科幻长篇小说，2008年由重庆出版社出版。故事讲述科学家叶文洁、纳米材料学家汪淼与警察史强在地球文明和三体文明接触中的经历，探讨宇宙社会学、文明冲突与黑暗森林法则。';seed();notify('已载入《三体》示例图谱')}
function resetGraph(){loadDemo();clearFocus()}function notify(s){let e=document.getElementById('notice');e.textContent=s;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2200)}seed();
</script></body></html>
